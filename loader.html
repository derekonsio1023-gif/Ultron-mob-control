<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cargando…</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style>
</head>
<body>
<script>
// ══════════════════════════════════════════════════════════════════
//  Este archivo vive EN EL MISMO REPO que el juego.
//  Solo tienes que ajustar ENTRY si el archivo del juego no se llama
//  "index.html". Todo lo demás se resuelve por ruta relativa.
// ══════════════════════════════════════════════════════════════════
const ENTRY = 'index.html';                    // ← nombre del HTML del juego
const GAME_URL = new URL(ENTRY, location.href).href;
const BASE_DIR = GAME_URL.replace(/[^/]*$/, '');

// ══════════════════════════════════════════════════════════════════
//  SHIM — función real (cero escapes, cero CSP inline)
// ══════════════════════════════════════════════════════════════════
function ULTRON_SHIM() {
  try {
    console.log('[LOADER] shim arrancando, contexto:', window === top ? 'TOP' : 'IFRAME');

    var _create = document.createElement.bind(document);
    document.createElement = function (tag) {
      var el = _create(tag);
      var t = String(tag).toLowerCase();
      if (t === 'img') {
        try { if (!el.crossOrigin) el.crossOrigin = 'anonymous'; } catch (e) {}
      }
      if (t === 'script') {
        var _src = '';
        Object.defineProperty(el, 'src', {
          get: function () { return _src; },
          set: function (v) {
            if (typeof v === 'string' && /ytgame\.js/i.test(v)) {
              console.log('[LOADER] bloqueado script ytgame:', v);
              return;
            }
            _src = v;
            el.setAttribute('src', v);
          },
          configurable: true
        });
      }
      return el;
    };

    var _append = Element.prototype.appendChild;
    Element.prototype.appendChild = function (c) {
      if (c && c.tagName === 'SCRIPT' && c.src && /ytgame\.js/i.test(c.src)) return c;
      return _append.call(this, c);
    };

    var srcDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
    if (srcDesc) {
      Object.defineProperty(HTMLImageElement.prototype, 'src', {
        get: function () { return srcDesc.get.call(this); },
        set: function (v) {
          try { if (!this.crossOrigin) this.crossOrigin = 'anonymous'; } catch (e) {}
          srcDesc.set.call(this, v);
        },
        configurable: true
      });
    }

    var coDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'crossOrigin');
    if (coDesc) {
      Object.defineProperty(HTMLImageElement.prototype, 'crossOrigin', {
        get: function () { return coDesc.get.call(this); },
        set: function (v) { coDesc.set.call(this, v || 'anonymous'); },
        configurable: true
      });
    }

    var _sa = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function (n, v) {
      if (this.tagName === 'IMG' && String(n).toLowerCase() === 'src') {
        try { if (!this.crossOrigin) this.crossOrigin = 'anonymous'; } catch (e) {}
      }
      return _sa.call(this, n, v);
    };

    var _Image = window.Image;
    window.Image = function (w, h) {
      var img = new _Image(w, h);
      try { if (!img.crossOrigin) img.crossOrigin = 'anonymous'; } catch (e) {}
      return img;
    };
    window.Image.prototype = _Image.prototype;

    try {
      var _cib = window.createImageBitmap;
      if (_cib) {
        window.createImageBitmap = function (src) {
          var args = Array.prototype.slice.call(arguments);
          if (src && src.tagName === 'IMG' && !src.crossOrigin) {
            try { src.crossOrigin = 'anonymous'; } catch (e) {}
          }
          return _cib.apply(this, args);
        };
      }
    } catch (e) {}

    try {
      var _xopen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function () {
        var r = _xopen.apply(this, arguments);
        try { this.withCredentials = false; } catch (e) {}
        return r;
      };
    } catch (e) {}

    try {
      var _fetch = window.fetch;
      window.fetch = function (input, init) {
        init = init || {};
        if (!init.mode) init.mode = 'cors';
        if (!init.credentials) init.credentials = 'omit';
        return _fetch.call(this, input, init);
      };
    } catch (e) {}

    try {
      var _decode = HTMLImageElement.prototype.decode;
      if (_decode) {
        HTMLImageElement.prototype.decode = function () {
          try { if (!this.crossOrigin) this.crossOrigin = 'anonymous'; } catch (e) {}
          return _decode.apply(this, arguments);
        };
      }
    } catch (e) {}

    var P = function (v) { return function () { return Promise.resolve(v); }; };
    var N = function () {};
    var SAVE = P({ data: '', checksum: '' });
    var api = {
      game: {
        firstFrameReady: N, gameReady: N,
        loadData: SAVE, saveData: P(), sendScore: P(), log: N,
        getLanguage: P('en'),
        getSafeArea: P({ top: 0, left: 0, right: 0, bottom: 0 })
      },
      system: {
        onPause: N, onResume: N, onStateChange: N,
        isAudioEnabled: P(true), onAudioEnabledChange: N
      },
      engagement: { sendScore: P(), openStore: P() },
      environment: { getEnvironment: P({}) },
      health: { logError: N, logWarning: N, logInfo: N },
      ads: { requestInterstitialAd: P(), requestRewardedAd: P({ status: 'closed' }) }
    };

    function wrap(o, p) {
      return new Proxy(o, {
        get: function (t, k) {
          if (k === 'then') return undefined;
          if (typeof k === 'symbol') return undefined;
          var v = t[k];
          if (v !== undefined) {
            if (typeof v === 'function') return v;
            if (typeof v === 'object' && v !== null) return wrap(v, p + '.' + String(k));
            return v;
          }
          var stub = function () { return Promise.resolve({ data: '', checksum: '' }); };
          return wrap(stub, p + '.' + String(k));
        },
        apply: function () { return Promise.resolve({ data: '', checksum: '' }); }
      });
    }

    var s = wrap(api, 'ytgame');
    try {
      Object.defineProperty(window, 'ytgame', {
        get: function () { return s; },
        set: function () {},
        configurable: false,
        enumerable: true
      });
    } catch (e) {
      window.ytgame = s;
    }
    console.log('[LOADER] shim instalado, window.ytgame =', typeof window.ytgame);

    var _checkCount = 0;
    setInterval(function () {
      if (window.ytgame !== s) {
        try {
          Object.defineProperty(window, 'ytgame', {
            get: function () { return s; },
            set: function () {},
            configurable: false,
            enumerable: true
          });
          console.log('[LOADER] ytgame reinstalado (watchdog #' + (++_checkCount) + ')');
        } catch (e) {
          try { window.ytgame = s; } catch (e2) {}
        }
      }
    }, 50);

  } catch (e) {
    console.error('[LOADER] shim error:', e);
  }
}

var SHIM_SOURCE = '(' + ULTRON_SHIM.toString() + ')();';
var SHIM_BLOB   = new Blob([SHIM_SOURCE], { type: 'application/javascript' });
var SHIM_URL    = URL.createObjectURL(SHIM_BLOB);
console.log('[LOADER] shim blob URL:', SHIM_URL);

// ══════════════════════════════════════════════════════════════════
//  Cargador
// ══════════════════════════════════════════════════════════════════
(function () {
  var LT = String.fromCharCode(60);
  var GT = String.fromCharCode(62);
  var SL = String.fromCharCode(47);
  var EC = LT + SL + 'script' + GT;

  var SHIM_TAG = LT + 'script src="' + SHIM_URL + '"' + GT + EC;

  console.log('[LOADER] fetch de', GAME_URL);

  fetch(GAME_URL)
    .then(function (r) { return r.text(); })
    .then(function (html) {
      html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + BASE_DIR + '">');

      var needle = 'ytgame.js';
      var i = html.indexOf(needle);
      while (i !== -1) {
        var o = html.lastIndexOf(LT, i);
        var c = html.indexOf(EC, i);
        if (o !== -1 && c !== -1) {
          html = html.slice(0, o) + html.slice(c + EC.length);
        }
        i = html.indexOf(needle, i + needle.length);
      }

      var injected = false;
      function tryAt(re, after) {
        if (injected) return;
        var m = re.exec(html);
        if (!m) return;
        var pos = after ? m.index + m[0].length : m.index;
        html = html.slice(0, pos) + SHIM_TAG + html.slice(pos);
        injected = true;
      }
      tryAt(/<script\b/i, false);
      tryAt(/<\/head\s*>/i, false);
      tryAt(/<body\b/i, false);
      tryAt(/<html\b[^>]*>/i, true);
      if (!injected) html = SHIM_TAG + html;

      console.log('[LOADER] inyectado:', injected);

      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (e) {
      console.error('[LOADER] error:', e);
      document.body.innerHTML = 'Error: ' + (e && e.message ? e.message : e);
    });
})();
</script>
</body>
</html>
